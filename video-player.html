<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>视频播放器</title>
    <!-- Video.js CSS -->
    <link href="./video-js.min.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000;
      }
      .video-container {
        width: 100%;
        max-width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .video-js {
        width: 100%;
        height: 100%;
        max-height: 100vh;
      }
    </style>
  </head>
  <body>
   
    <div class="video-container">
      <video
        id="my-video"
        class="video-js vjs-default-skin vjs-big-play-centered"
        controls
        preload="auto"
      >
        <p class="vjs-no-js">
          要查看此视频，请启用JavaScript，并考虑升级到支持HTML5视频的Web浏览器
        </p>
      </video>
    </div>

    <!-- Video.js JavaScript -->
    <script src="./video.min.js"></script>
    <!-- 微信 JSSDK -->
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>

    <script>
      // 判断是否在微信浏览器中
      function isWeixinBrowser() {
        const ua = navigator.userAgent.toLowerCase();
        return ua.indexOf('micromessenger') !== -1;
      }

      // 从URL获取视频ID
      function getVideoIdFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get("vid");
      }

      // 检测是否来自小程序
      function isFromWeapp() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get("from") === "weapp";
      }

      // 处理分享按钮点击
      function handleShare() {
        // 如果来自小程序，隐藏分享按钮
        if (isFromWeapp()) {
          const videoId = getVideoIdFromUrl();
          // 向小程序发送分享信息
          wx.miniProgram.postMessage({
            data: {
              action: "share",
            },
          });
          console.log('postMessage 已调用');
          return;
        }

        const videoId = getVideoIdFromUrl();
        const currentUrl = window.location.href;
        const title = '分享视频';
        const desc = '我发现了一个有趣的视频，快来看看吧！';
        
        if (window.wx) {
          // 调用微信分享
          wx.ready(function() {
            wx.updateAppMessageShareData({ 
              title: title,
              desc: desc,
              link: currentUrl,
              imgUrl: `./files/${videoId}.mp4?x-oss-process=video/snapshot,t_1,f_jpg`,
              success: function () {
                alert('分享成功！');
              }
            });
            
            wx.updateTimelineShareData({ 
              title: title,
              link: currentUrl,
              imgUrl: `./files/${videoId}.mp4?x-oss-process=video/snapshot,t_1,f_jpg`,
              success: function () {
                alert('分享成功！');
              }
            });
          });
        }
      }

      // 初始化视频播放器
      function initializePlayer() {  
        const videoId = getVideoIdFromUrl();

        if (!videoId) {
          console.error("未找到视频ID");
          document.body.innerHTML =
            '<div style="color: white; text-align: center; width: 100%;">未找到视频ID</div>';
          return;
        }

        const videoSrc = `./files/${videoId}.mp4`;

        // 初始化Video.js
        const player = videojs("my-video", {
          sources: [
            {
              src: videoSrc,
              type: "video/mp4",
            },
          ],
          fluid: true,
          responsive: true,
          playbackRates: [0.5, 1, 1.5, 2],
          poster: `./files/${videoId}.mp4?x-oss-process=video/snapshot,t_1,f_jpg`,
          controlBar: {
            pictureInPictureToggle: false,
          },
        });

        // 自动播放（注意：移动端可能会被浏览器策略阻止自动播放）
        player.ready(function () {
          // 设置视频尺寸
          const containerHeight =
            document.querySelector(".video-container").clientHeight;
          player.dimensions("auto", containerHeight);

          // 尝试播放
          player.play().catch(function (error) {
            console.log("自动播放被阻止，需要用户交互才能播放", error);
          });
        });

        // 错误处理
        player.on("error", function () {
          console.error("视频加载错误");
          document.body.innerHTML =
            '<div style="color: white; text-align: center; width: 100%;">视频加载错误</div>';
        });
      }

      // 页面加载完成后初始化
      document.addEventListener("DOMContentLoaded", initializePlayer);
    </script>
  </body>
</html>
